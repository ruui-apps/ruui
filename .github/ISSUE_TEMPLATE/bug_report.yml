
name: Bug Report
description: Report a bug or unexpected behaviour in RUUI.
title: "bug: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue!

        Please provide as much relevant information as possible.
        This helps us understand, reproduce and resolve the problem.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of RUUI is affected?
      options:
        - Core framework
        - Components / Widgets
        - Reactivity
        - Procedural macros
        - Platform backend
        - CLI / Build tooling
        - Documentation
        - Other / Unsure
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where does the issue occur?
      options:
        - Linux
        - macOS
        - Windows
        - Android
        - iOS
        - watchOS
        - Wear OS
        - Multiple platforms
        - Not platform-specific
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: RUUI version
      description: Specify the version or commit you are using.
      placeholder: "e.g. 0.1.0 or commit hash"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Explain what is happening and why it is a problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide steps or a minimal code example to reproduce the issue.
      placeholder: |
        1. Create an application...
        2. Add a component...
        3. Run the application...
        4. Observe the issue...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or additional context
      description: |
        Include relevant error messages, logs, screenshots
        or anything else that might help us investigate.
    validations:
      required: false
